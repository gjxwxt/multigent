# Spring Boot + React 全栈基线 CI/CD：lint / test / build 三 stage（push 与 MR 触发），
# tag 流水线追加 package / deploy 两 stage（就地构建不推送），
# 也支持平台经 GitLab API 触发的分支部署（见下方「分支部署链与审批闸门」）。
#
# 本文件遵循平台确定性基线（react_spring_boot 模板 1.1.0）：
# 1. workflow:rules 去重——feature 分支 push 不建流水线，卡点收敛到 MR；
#    保留 tag（部署链触发）、默认分支（合并后兜底）、web/api（手动触发调试）。
# 2. 前端 job 统一 npmmirror 源 + package-lock 键控缓存（web/.npm）。
# 3. 独立 job 用 needs: [] 打平 stage 屏障，避免 runner 并发不足时串行排队。
# 4. default.interruptible：同分支新提交自动取消过时流水线；package/deploy 不可中断。
# 5. apk 用 --cache-dir /cache/apk（runner 已挂载宿主 /cache 卷）：
#    禁用 --no-cache，使用宿主卷复用缓存。
# 6. runner tags 统一指定为 [docker]。
#
# ── 分支部署链与审批闸门（react_spring_boot 1.1.0）────────────
# 1. 分支部署链：平台经 GitLab API 以 ref=分支 + variables(MULTIGENT_DEPLOY=1,
#    MULTIGENT_DEPLOY_TOKEN=HMAC) 触发流水线时，package/deploy 也在分支 SHA 上
#    执行（workflow:rules 已含 api source，无需另改）。
# 2. 镜像 tag 语义：tag 优先（$CI_COMMIT_TAG），分支流水线回退到 $CI_COMMIT_SHORT_SHA。
# 3. 审批闸门（fail-closed）：deploy 首行回查平台审批（GET /api/v1/deploy-verify）；
#    tag 流水线无 token，跳过闸门；分支流水线无 token 或回查失败一律拒绝部署。

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

default:
  interruptible: true

variables:
  APP_PORT: "8088"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - lint
  - test
  - build
  - package
  - deploy

# 前端 job 公共模板：npmmirror 源 + lockfile 键控 npm 缓存
.frontend:
  image: node:22
  tags: [docker]
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm
  before_script:
    - cd web
    - npm config set registry https://registry.npmmirror.com
    - npm ci --cache .npm --prefer-offline

# 后端 job 公共配置：Gradle 缓存
.backend:
  image: eclipse-temurin:21-jdk-alpine
  tags: [docker]
  cache:
    key: gradle-cache
    paths:
      - .gradle/caches
      - .gradle/wrapper

# ---------- lint ----------
lint:backend:
  extends: .backend
  stage: lint
  needs: []
  script:
    - cd server && ./gradlew check -x test

# ---------- test ----------
test:backend:
  extends: .backend
  stage: test
  needs: []
  script:
    - cd server && ./gradlew test

# ---------- build ----------
build:frontend:
  extends: .frontend
  stage: build
  needs: []
  script:
    - npm run build
  artifacts:
    paths:
      - web/dist
    expire_in: 1 hour

build:backend:
  extends: .backend
  stage: build
  needs:
    - job: build:frontend
      artifacts: true
  script:
    - mkdir -p server/src/main/resources/static
    - cp -r web/dist/* server/src/main/resources/static/
    - cd server && ./gradlew bootJar -x test
    - cd "$CI_PROJECT_DIR" && mkdir -p build/libs && cp server/build/libs/*.jar build/libs/app.jar
  artifacts:
    paths:
      - build/libs/app.jar
    expire_in: 1 hour

# ---------- package（tag 流水线或平台 API 触发的分支部署）----------
package:
  stage: package
  image: alpine:3.20
  tags: [docker]
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "api" && $MULTIGENT_DEPLOY == "1"
  needs:
    - job: build:backend
      artifacts: true
  script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories && apk add --cache-dir /cache/apk docker-cli
    # 镜像 tag：tag 流水线用 $CI_COMMIT_TAG，分支流水线回退到短 SHA。
    - docker build -f deploy/Dockerfile -t "$CI_PROJECT_NAME:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" .
    - docker images "$CI_PROJECT_NAME:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

# ---------- deploy（tag 流水线或平台 API 触发的分支部署）----------
deploy:
  stage: deploy
  image: alpine:3.20
  tags: [docker]
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "api" && $MULTIGENT_DEPLOY == "1"
  needs:
    - job: package
      artifacts: false
  environment:
    name: production
    url: http://localhost:8088
  script:
    # 部署闸门（fail-closed）：平台签发的 HMAC token 回查审批状态；tag 流水线无 token，跳过闸门
    - |
      if [ -z "${MULTIGENT_DEPLOY_TOKEN:-}" ]; then
        if [ -z "${CI_COMMIT_TAG:-}" ]; then echo "deploy gate: no token and not a tag pipeline — refusing"; exit 1; fi
        echo "deploy gate: tag pipeline, gate skipped"
      else
        DEPLOY_URL="${MULTIGENT_CONSOLE_URL:-http://host.docker.internal:27892}/api/v1/deploy-verify"
        wget -q --header "X-Multigent-Deploy-Token: ${MULTIGENT_DEPLOY_TOKEN}" -O /dev/null "${DEPLOY_URL}?project=${MULTIGENT_PROJECT_NAME:-$CI_PROJECT_NAME}&sha=${CI_COMMIT_SHA}" \
          || { echo "deploy gate: platform approval check FAILED for $CI_COMMIT_SHA"; exit 1; }
        echo "deploy gate: approval verified for $CI_COMMIT_SHA"
      fi
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories && apk add --cache-dir /cache/apk docker-cli docker-cli-compose
    # 起容器：镜像名与 package 步一致，TAG/APP_PORT 注入本次 tag（或短 SHA）与发布端口
    - IMAGE_NAME="$CI_PROJECT_NAME" TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" docker compose -f deploy/compose.yml up -d
    # 探活：平台触发打 MULTIGENT_DEPLOY_HOST（与平台健康卡同口径，绕开 fake-IP
    # 对 host.docker.internal 的 DNS 劫持）；tag 流水线回退本机 daemon。
    - |
      PROBE_HOST="${MULTIGENT_DEPLOY_HOST:-host.docker.internal}"
      ok=0
      for i in $(seq 1 30); do
        if wget -q -O /dev/null "http://${PROBE_HOST}:${APP_PORT}/api/health"; then ok=1; echo "health OK after ${i} attempts"; break; fi
        sleep 2
      done
      [ "$ok" = "1" ] || { echo "health check timed out (~60s)"; docker compose -f deploy/compose.yml ps; exit 1; }
    - IMAGE_NAME="$CI_PROJECT_NAME" TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" docker compose -f deploy/compose.yml ps
    # 镜像治理：项目镜像只留最新 5 个 + 清一周前 dangling/构建缓存（失败不阻断部署结果）
    - docker images --format '{{.Repository}}:{{.Tag}}' "$CI_PROJECT_NAME" | tail -n +6 | xargs -r docker rmi || true
    - docker image prune -f --filter "until=168h" || true
