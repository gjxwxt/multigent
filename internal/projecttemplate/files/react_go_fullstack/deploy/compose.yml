# 部署编排：单容器交付（后端二进制已内嵌前端产物）。
# 变量由 CI deploy job 注入；本地手动部署示例：
#   make build && docker build -f deploy/Dockerfile -t app:dev .
#   IMAGE_NAME=app TAG=dev docker compose -f deploy/compose.yml up -d
services:
  app:
    image: ${IMAGE_NAME:-app}:${TAG:-dev}
    ports:
      - "${APP_PORT:-8088}:8080"
    restart: unless-stopped
    environment:
      # 与 CI 探测同源的全局 API 前缀（healthcheck 进程读不到 CI variables，
      # compose up 会把宿主侧 API_BASE 注入容器 environment）。
      API_BASE: ${API_BASE:-/api}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://127.0.0.1:8080$${API_BASE}/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
